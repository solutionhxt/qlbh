<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <title>Quản lý bán hàng</title>
  <meta name="description" content="Phần mềm quản lý bán hàng — dữ liệu lưu trên Google Drive">

  <style>

    Trang này chỉ nhúng web app Apps Script để chạy dưới tên miền riêng.

  -->
  <div class="loading">Đang tải ứng dụng…</div>
  <iframe
    src="https://script.google.com/macros/s/AKfycbw1pRrxwgekIUErmEmdDog1zIRwHU4eIA5xNBU5GdPTFajUwmjdm6YHARuBm9vBfasm/exec"
